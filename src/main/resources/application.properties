spring.application.name=ProyectoAplicacionesWeb

# ---------------------------------------------------------------
# Conexion a MySQL
# ---------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/libreria_raudskinna?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Las credenciales de MySQL se obtienen de variables de entorno.
# Cada integrante debe configurar DB_USERNAME y DB_PASSWORD en su equipo.
# No almacenar usuarios ni contraseñas directamente en este archivo.
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ---------------------------------------------------------------
# Configuracion JPA/Hibernate
# ---------------------------------------------------------------
# update: Hibernate crea o actualiza las tablas segun las entidades.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
app.uploads.dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Autenticación JWT para la API REST.
# La clave secreta se obtiene de una variable de entorno.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-seconds=3600