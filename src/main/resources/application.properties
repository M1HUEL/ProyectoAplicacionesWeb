spring.application.name=ProyectoAplicacionesWeb

# Conexión a MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/libreria_raudskinna?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Consola H2 desactivada al usar MySQL
spring.h2.console.enabled=false
