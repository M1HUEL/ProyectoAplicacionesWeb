spring.application.name=ProyectoAplicacionesWeb

# ---------------------------------------------------------------
# Conexion a MySQL
# ---------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/libreria_raudskinna?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------------------------------------------------------
# Credenciales mediante variables de entorno
# ---------------------------------------------------------------
# Las credenciales de MySQL se obtienen de variables de entorno.
# Cada integrante debe configurar DB_USERNAME y DB_PASSWORD en su equipo.
# No almacenar usuarios ni contraseñas directamente en este archivo.
# spring.datasource.username=${DB_USERNAME}
# spring.datasource.password=${DB_PASSWORD}

# ===============================================================
# CONFIGURACION LOCAL DE MIGUEL
# ---------------------------------------------------------------
# Estas credenciales son exclusivas del entorno local de Miguel.
# NO MODIFICAR este bloque ni cambiar la contraseña.
# Si otro integrante necesita ejecutar el proyecto, debe usar su
# propia configuración local; no reutilizar estas credenciales.
# Mensaje de Miguel: SI LO UTILIZA ALGUIEN LE VOY A ARRANCAR LA CABEZA
# ===============================================================
spring.datasource.username=root
spring.datasource.password=password

# ---------------------------------------------------------------
# Configuracion JPA/Hibernate
# ---------------------------------------------------------------
# update: Hibernate crea o actualiza las tablas segun las entidades.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
app.uploads.dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Autenticación JWT para la API REST.
# ATENCVION: NO ES NECESARIO PONER COMO VARIABLE DE ENTORNO ESTA COSA.
# gracias por su atencion.
#
# Clave por defecto para desarrollo local. Si existe la variable de
# entorno JWT_SECRET, se usa esa; si no, se usa esta clave.
# En producción configurar siempre JWT_SECRET.
app.jwt.secret=${JWT_SECRET:xz21qSAcmeRkza4GPjm8xq/SiZadrIBR9WE7VCJLbm0=}
app.jwt.expiration-seconds=3600
