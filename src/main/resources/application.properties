spring.application.name=ProyectoAplicacionesWeb

# ---------------------------------------------------------------
# Conexion a MySQL
# ---------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/libreria_raudskinna?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# CAMBIO: las credenciales se definen directamente para desarrollo local.
# Antes se leian de variables de entorno (DB_USERNAME y DB_PASSWORD), pero
# eso obligaba a cada integrante a configurarlas en su equipo y en NetBeans.
# Solo para desarrollo: en produccion volver a usar variables de entorno.
# spring.datasource.username=${DB_USERNAME}
# spring.datasource.password=${DB_PASSWORD}
spring.datasource.username=root
spring.datasource.password=ITSON

# ---------------------------------------------------------------
# Configuracion JPA/Hibernate
# ---------------------------------------------------------------
# update: Hibernate crea o actualiza las tablas segun las entidades.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
app.uploads.dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB