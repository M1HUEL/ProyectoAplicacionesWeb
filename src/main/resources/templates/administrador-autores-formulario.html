<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Registrar autor · Librería Raudskinna</title>

    <!-- Estilos generales del proyecto.-->
    <link rel="stylesheet" th:href="@{/styles/index.css}">
</head>

<body class="admin-layout">

<!--
    Reutiliza el menú lateral del panel administrativo.
    El registro de autores forma parte de la gestión del catálogo.
-->
<th:block th:replace="~{fragments/admin-sidebar :: sidebar('libros')}">
</th:block>

<!-- Contenido principal del registro administrativo de autores. -->
<main class="admin-contenido">

    <section class="panel registro">

        <h1>Registrar autor</h1>

        <p>
            Ingresa el nombre del autor que deseas
            incorporar al catálogo.
        </p>

        <!--
            Muestra los errores de validación enviados por AutorController.
            El mensaje se conserva durante la redirección mediante
            RedirectAttributes.
        -->
        <p th:if="${error}"
           th:text="${error}"
           class="mensaje-error"
           role="alert">

            <!--
        Formulario administrativo para registrar autores.

        Envía los datos mediante POST a AutorController.
        Las validaciones se realizan en la capa Service.
        Spring Security mantiene habilitada la protección CSRF.
    -->
        <form class="formulario"
              th:action="@{/admin/autores}"
              method="post">


            <label for="nombre">Nombre del autor</label>

            <input class="campo campo-formulario"
                   id="nombre"
                   name="nombre"
                   type="text"
                   th:value="${nombreAnterior}"
                   maxlength="150"
                   placeholder="Ej. Bram Stoker"
                   required>


            <button class="boton boton-primario"
                    type="submit">
                Guardar
            </button>

            <a class="boton boton-claro"
               th:href="@{/admin/autores}">
                Cancelar
            </a>

        </form>

    </section>

</main>

</body>
</html>
