
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title th:text="${editorial != null}
        ? 'Editar editorial · Librería Raudskinna'
        : 'Registrar editorial · Librería Raudskinna'">
        Registrar editorial · Librería Raudskinna
    </title>

    <!-- Estilos generales del proyecto. -->
    <link rel="stylesheet" th:href="@{/styles/index.css}">
</head>

<body class="admin-layout">

<!--
    Reutiliza el menú lateral del panel administrativo.
    El registro de editoriales forma parte de la gestión del catálogo.
-->
<th:block th:replace="~{fragments/admin-sidebar :: sidebar('editoriales')}">
</th:block>

<!-- Contenido principal del registro administrativo de editoriales. -->
<main class="admin-contenido">

    <section class="panel registro">

        <!-- Título según la operación administrativa. -->
        <h1 th:text="${editorial != null}
        ? 'Editar editorial'
        : 'Registrar editorial'">
            Registrar editorial
        </h1>

        <!-- Descripción según el formulario utilizado. -->
        <p th:text="${editorial != null}
        ? 'Modifica los datos de la editorial seleccionada y guarda los cambios.'
        : 'Ingresa los datos de la editorial que deseas incorporar al catálogo.'">
            Ingresa los datos de la editorial.
        </p>

        <!--
            Espacio para los mensajes de validación que
            recibiremos posteriormente desde EditorialController.
        -->
        <p th:if="${error}"
           th:text="${error}"
           class="mensaje-error"
           role="alert">
            Mensaje de error.
        </p>

        <!--
    Formulario reutilizable para registrar y editar editoriales.

    En modo registro envía POST a /admin/editoriales.
    En modo edición envía POST a /admin/editoriales/{id}/editar.

    Spring Security mantiene habilitada la protección CSRF.
-->
        <form class="formulario"
              th:action="${editorial != null}
          ? @{/admin/editoriales/{id}/editar(id=${editorial.id})}
          : @{/admin/editoriales}"
              method="post">

            <!-- Nombre obligatorio de la editorial. -->
            <label for="nombre">Nombre de la editorial</label>

            <input class="campo campo-formulario"
                   id="nombre"
                   name="nombre"
                   type="text"
                   th:value="${nombreAnterior != null}
                   ? ${nombreAnterior} : (${editorial != null}
                   ? ${editorial.nombre} : '')"
                   maxlength="150"
                   placeholder="Ej. Penguin Random House"
                   required>

            <!-- Dirección opcional de la editorial. -->
            <label for="direccion">Dirección</label>

            <input class="campo campo-formulario"
                   id="direccion"
                   name="direccion"
                   type="text"
                   th:value="${direccionAnterior != null}
                   ? ${direccionAnterior} : (${editorial != null}
                   ? ${editorial.direccion} : '')"
                   maxlength="255"
                   placeholder="Ej. Ciudad de México">

            <small>
                La dirección es opcional.
            </small>

            <!-- Acciones del formulario. -->
            <button class="boton boton-primario"
                    type="submit">
                Guardar
            </button>

            <a class="boton boton-claro"
               th:href="@{/admin/editoriales}">
                Cancelar
            </a>

        </form>

    </section>

</main>

</body>
</html>
