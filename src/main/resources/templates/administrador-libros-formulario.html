<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Libro · Librería Raudskinna</title>
    <link rel="stylesheet" th:href="@{/styles/index.css}" />
  </head>
  <body>
    <th:block th:replace="~{fragments/header :: header('inicio')}"></th:block>

    <main class="contenedor">
      <section class="panel registro">
        <h1>Agregar/Editar libro</h1>
        <form class="formulario">
          <label for="titulo">Título</label>
          <input class="campo campo-formulario" id="titulo" type="text" required />

          <label for="autor">Autor</label>
          <input class="campo campo-formulario" id="autor" type="text" required />

          <label for="precio">Precio</label>
          <input class="campo campo-formulario" id="precio" type="number" step="0.01" required />

          <label for="stock">Stock</label>
          <input class="campo campo-formulario" id="stock" type="number" required />

          <button class="boton boton-primario" type="submit">Guardar</button>
          <a class="boton boton-claro" th:href="@{/administrador/libros}">Cancelar</a>
        </form>
      </section>
    </main>

    <footer class="pie">
      <div class="contenedor">
        <span>Librería Raudskinna · Administración</span>
        <nav aria-label="Pie de página">
          <a th:href="@{/}">Panel</a> · <a th:href="@{/administrador/libros}">Libros</a> ·
          <a th:href="@{/administrador/ordenes}">Órdenes</a> · <a th:href="@{/logout}">Cerrar sesión</a>
        </nav>
      </div>
    </footer>
  </body>
</html>
