<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Libros e inventario · Librería Raudskinna</title>
    <link rel="stylesheet" th:href="@{/styles/index.css}" />
  </head>
  <body class="admin-layout">
  <!-- Navegación reutilizable del panel administrativo. -->
  <th:block th:replace="~{fragments/admin-sidebar :: sidebar('libros')}"></th:block>

    <main class="admin-contenido">
      <div class="encabezado-pagina">
        <p class="sobretitulo">Administración</p>
        <h1>Libros e inventario</h1>
        <p>Gestiona el catálogo, precios y existencias.</p>
        <div class="acciones">
          <!-- Abre el formulario administrativo para registrar un libro. -->
          <a class="boton boton-primario"
             th:href="@{/admin/libros/nuevo}">
            Agregar libro
          </a>
        </div>
      </div>

      <!--
          Muestra la confirmación del registro de un libro.

          El mensaje proviene de LibroController mediante
          RedirectAttributes después de guardar correctamente.
      -->
      <p th:if="${mensaje}"
         th:text="${mensaje}"
         role="status">
        Libro registrado correctamente.
      </p>


      <section class="panel">
        <div class="tabla-contenedor">
          <table class="tabla">
            <thead>
            <tr>
              <th>Título</th>
              <th>Autor(es)</th>
              <th>Formato</th>
              <th>Precio</th>
              <th>Stock</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
            </thead>

            <tbody>

            <!-- Mensaje cuando no existen presentaciones comerciales. -->
            <tr th:if="${#lists.isEmpty(libros)}">
              <td colspan="7">
                No hay libros registrados con formatos comerciales.
              </td>
            </tr>

            <!--
                Genera una fila por cada presentación comercial
                recuperada desde LibroService.

                Los datos provienen de LibroListadoDTO.
            -->
            <tr th:each="libro : ${libros}">

              <!-- Información bibliográfica. -->
              <td th:text="${libro.titulo}">Título</td>
              <td th:text="${libro.autores}">Autores</td>

              <!-- Formato y precio de la presentación. -->
              <td th:text="${libro.formato}">Formato</td>

              <td th:text="${#numbers.formatDecimal(libro.precio, 1, 2)}">
                0.00
              </td>

              <!-- El formato digital no maneja inventario físico. -->
              <td th:text="${libro.stock != null ? libro.stock : '—'}">
                —
              </td>

              <!-- Estado calculado previamente en LibroService. -->
              <td th:text="${libro.estado}">Estado</td>

              <!--
                  Abre el formulario de edición correspondiente
                  a la presentación comercial seleccionada.

                  Se utilizan ambos identificadores:
                  - libroId: identifica el libro.
                  - formatoId: identifica su presentación comercial.
              -->
              <td class="acciones-tabla">
                <a th:href="@{/admin/libros/{libroId}/formatos/{formatoId}/editar(
            libroId=${libro.libroId},
            formatoId=${libro.formatoId}
        )}">
                  Editar
                </a>
              </td>

            </tr>

            </tbody>
          </table>
        </div>
      </section>
    </main>
  </body>
</html>
