<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Órdenes · Librería Raudskinna</title>
    <link rel="stylesheet" th:href="@{/styles/index.css}" />
  </head>
  <body>
    <th:block th:replace="~{fragments/header :: header('inicio')}"></th:block>

    <main class="contenedor">
      <div class="encabezado-pagina">
        <p class="sobretitulo">Administración</p>
        <h1>Órdenes</h1>
        <p>Revisa y actualiza el estado de los pedidos.</p>
      </div>

      <section class="panel">
        <div class="tabla-contenedor">
          <table class="tabla">
            <thead>
              <tr>
                <th>Folio</th>
                <th>Cliente</th>
                <th>Total</th>
                <th>Estado</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>#001</td>
                <td>Ejemplo</td>
                <td>$599.00</td>
                <td>Pendiente</td>
                <td class="acciones-tabla">
                  <a class="boton boton-claro" href="#">Marcar procesado</a>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <footer class="pie">
      <div class="contenedor">
        <span>Librería Raudskinna · Administración</span>
        <nav aria-label="Pie de página">
          <a th:href="@{/}">Panel</a> · <a th:href="@{/administrador/libros}">Libros</a> ·
          <a th:href="@{/administrador/ordenes}">Órdenes</a> · <a th:href="@{/logout}">Cerrar sesión</a>
        </nav>
      </div>
    </footer>
  </body>
</html>
