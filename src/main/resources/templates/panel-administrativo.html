
<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Panel administrativo · Librería Raudskinna</title>
  <link rel="stylesheet" th:href="@{/styles/index.css}" />
</head>

<body class="admin-layout">

<!-- Navegación reutilizable del área administrativa. -->
<th:block th:replace="~{fragments/admin-sidebar :: sidebar('panel')}"></th:block>

<!-- Contenido principal del panel. -->
<main class="admin-contenido">

  <div class="encabezado-pagina">
    <p class="sobretitulo">Panel administrativo</p>
    <h1>Gestión de la librería</h1>
    <p>Administra libros, existencias y órdenes desde un solo lugar.</p>
  </div>

  <!--
  Tarjetas de acceso a los módulos administrativos.
  Los indicadores se obtienen de MySQL mediante
  los servicios correspondientes.
-->
  <div class="admin-tarjetas">

    <section class="panel admin-tarjeta">
      <h2>Libros e inventario</h2>
      <!-- Cantidad de libros registrados en MySQL. -->
      <p class="admin-dato"
         th:text="|${totalLibros} libros registrados|">
        0 libros registrados
      </p>
      <p>Alta, edición, consulta y existencias del catálogo.</p>

      <a class="boton boton-primario" th:href="@{/admin/libros}">
        Gestionar
      </a>
    </section>

    <section class="panel admin-tarjeta">
      <h2>Órdenes</h2>
      <!-- Cantidad de órdenes pendientes en MySQL. -->
      <p class="admin-dato"
         th:text="|${ordenesPendientes} órdenes pendientes|">
        0 órdenes pendientes
      </p>
      <p>Revisa pedidos y actualiza su estado.</p>

      <a class="boton boton-primario" th:href="@{/admin/ordenes}">
        Gestionar
      </a>
    </section>

  </div>
</main>

</body>
</html>
