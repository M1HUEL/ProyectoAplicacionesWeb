
# Base de datos H2 exclusiva para pruebas de integración.
spring.datasource.url=jdbc:h2:mem:raudskinna_checkout_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Crear el esquema de pruebas desde las entidades JPA.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Evitar ruido innecesario de SQL durante las pruebas.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Credencial ficticia exclusiva del entorno H2 de pruebas.
RAUDSKINNA_ADMIN_PASSWORD=ClaveTemporalSoloParaIntegracion2026!

# Clave JWT ficticia, exclusiva para pruebas automatizadas.
app.jwt.secret=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
